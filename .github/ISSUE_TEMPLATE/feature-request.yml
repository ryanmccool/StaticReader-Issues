name: Feature request
description: Suggest an improvement for Static Reader
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For support, privacy, or product questions, visit https://staticevolution.com/support/. Do not include private books, credentials, tokens, personal data, or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would you like to accomplish, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternatives have you tried?
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I have not included private books, credentials, tokens, personal information, or other sensitive data.
          required: true
