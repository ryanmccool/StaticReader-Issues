name: Bug report
description: Report a reproducible problem in Static Reader
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Static Reader. Do not attach books or include credentials, tokens, full private feed content, or personal information. For support or privacy questions, visit https://staticevolution.com/support/.
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: Find this in Static Reader's About or Settings screen.
      placeholder: "1.0 (123)"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: iOS/iPadOS version
      placeholder: "iPadOS 26.5"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "iPad Pro (M4)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reliably shows the problem. Use generic or redacted names.
      placeholder: |
        1. Open...
        2. Tap...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Do not include private content.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Paste only redacted, relevant diagnostics. Remove names, paths, account details, URLs with tokens, book titles, feed contents, and other personal or private information. Never attach book files or credentials.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I have removed private books, credentials, tokens, full private feed content, and personal information.
          required: true
